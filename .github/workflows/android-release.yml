name: Android Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASS }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check signing configuration
        id: signing
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Signing secrets are not configured; release publication skipped."
          fi

      - uses: actions/setup-java@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        if: steps.signing.outputs.enabled == 'true'
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.signing.outputs.enabled == 'true'
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        if: steps.signing.outputs.enabled == 'true'
        run: |
          KEYSTORE_FILE="$RUNNER_TEMP/displayhub-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        run: gradle :app:assembleRelease

      - name: Build update site
        if: steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p site
          cp app/build/outputs/apk/release/app-release.apk site/displayhub-player.apk
          VERSION_CODE=$(grep -m1 'versionCode = ' app/build.gradle.kts | sed -E 's/.*versionCode = ([0-9]+).*/\1/')
          VERSION_NAME=$(grep -m1 'versionName = ' app/build.gradle.kts | sed -E 's/.*versionName = "([^"]+)".*/\1/')
          SHA256=$(sha256sum site/displayhub-player.apk | awk '{print $1}')
          cat > site/latest.json <<EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "apkUrl": "https://mgteixeira2112.github.io/displayhub-android-player/displayhub-player.apk",
            "sha256": "$SHA256"
          }
          EOF

      - uses: actions/configure-pages@v5
        if: steps.signing.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.signing.outputs.enabled == 'true'
        with:
          path: site

      - name: Deploy signed APK
        id: deployment
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
